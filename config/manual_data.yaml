# K-RESA 수동 입력 데이터
# 자동 수집이 어려운 구조적 데이터를 여기에 입력
# 출처와 기준일을 함께 기록

meta:
  last_updated: "2026-03-29"
  currency: "USD"
  note: "수동 입력 데이터 - 정기적으로 업데이트 필요"

# ─── 에너지 부문 ───
energy:
  hormuz_strait:
    daily_transit_mb: 21.0         # 일일 통과량 (백만 배럴)
    share_of_global_trade_pct: 21  # 글로벌 원유 교역 비중 (%)
    source: "EIA, 2025"

  korea_oil_import:
    total_annual_mt: 144.0         # 연간 총 수입량 (백만 톤, 2024)
    total_annual_mbd: 2.65         # 일일 수입량 (백만 배럴)
    by_country_pct:                # 국가별 비중 (%)
      middle_east: 72.0
      saudi_arabia: 30.5
      uae: 12.3
      iraq: 11.8
      kuwait: 10.2
      iran: 0.0
      us: 8.5
      russia: 5.2
      others: 14.3
    source: "한국석유공사, 2024"

  korea_lng:
    annual_import_mt: 46.5         # 연간 LNG 수입량 (백만 톤)
    avg_price_mmbtu: 12.8          # 평균 수입가 ($/MMBtu)
    by_country_pct:
      australia: 24.0
      qatar: 21.0
      us: 15.0
      malaysia: 10.0
      others: 30.0
    source: "한국가스공사, 2024"

  power_generation_mix_pct:        # 전력 생산 구성 (%)
    coal: 31.5
    lng: 29.8
    nuclear: 29.6
    renewables: 7.5
    oil: 0.5
    others: 1.1
    source: "전력거래소, 2025"

# ─── 농산물 부문 ───
agriculture:
  korea_grain_import:
    total_annual_mt: 22.5          # 연간 곡물 수입량 (백만 톤)
    by_crop_mt:
      corn: 11.5
      wheat: 4.8
      soybean: 1.8
      rice: 0.4
      others: 4.0
    self_sufficiency_pct: 21.0     # 식량 자급률
    source: "농림축산식품부, 2024"

  import_by_country_pct:
    us: 38.0
    brazil: 18.0
    australia: 12.0
    ukraine: 8.0
    argentina: 7.0
    others: 17.0
    source: "관세청, 2024"

  cpi_food_weight_pct: 14.7        # CPI 내 식품 가중치
  feed_price_index: 128.5          # 사료 가격 지수 (2020=100)
  fertilizer_price_index: 142.3    # 비료 가격 지수 (2020=100)

# ─── 산업별 구조 데이터 ───
industry:
  sectors:
    petrochemical:
      gdp_share_pct: 5.2
      energy_intensity: 0.85       # 에너지 집약도 (0-1, 높을수록 집약)
      export_share_pct: 12.3
      employment_thousand: 180
      import_dependency_pct: 78.0
    steel:
      gdp_share_pct: 3.1
      energy_intensity: 0.78
      export_share_pct: 5.8
      employment_thousand: 85
      import_dependency_pct: 62.0
    auto:
      gdp_share_pct: 5.8
      energy_intensity: 0.35
      export_share_pct: 14.2
      employment_thousand: 390
      import_dependency_pct: 45.0
    semiconductor:
      gdp_share_pct: 6.5
      energy_intensity: 0.40
      export_share_pct: 19.8
      employment_thousand: 195
      import_dependency_pct: 52.0
    shipbuilding:
      gdp_share_pct: 1.8
      energy_intensity: 0.45
      export_share_pct: 7.2
      employment_thousand: 105
      import_dependency_pct: 55.0
    cement:
      gdp_share_pct: 0.6
      energy_intensity: 0.82
      export_share_pct: 0.3
      employment_thousand: 18
      import_dependency_pct: 20.0
    refining:
      gdp_share_pct: 2.1
      energy_intensity: 0.92
      export_share_pct: 6.5
      employment_thousand: 25
      import_dependency_pct: 95.0
    agriculture_livestock:
      gdp_share_pct: 1.8
      energy_intensity: 0.25
      export_share_pct: 0.8
      employment_thousand: 520
      import_dependency_pct: 68.0
    services:
      gdp_share_pct: 58.0
      energy_intensity: 0.12
      export_share_pct: 15.0
      employment_thousand: 14200
      import_dependency_pct: 12.0

# ─── 금융 부문 ───
finance:
  bank_npl_ratio_pct: 0.45         # 은행 부실채권 비율
  corporate_debt:                   # 기업 부채 (조원)
    total_trillion_krw: 2850
    by_sector:
      manufacturing: 820
      construction: 380
      services: 1250
      real_estate: 400
    source: "한국은행, 2025Q1"

  bank_loan_portfolio_pct:          # 은행 대출 포트폴리오
    household: 52.0
    corporate: 38.0
    sme: 10.0
    source: "금융감독원, 2024"

# ─── 노동 부문 ───
labor:
  wage_growth_yoy_pct: 3.8         # 임금 인상률 (전년대비)
  labor_productivity_index: 108.5   # 노동생산성 지수 (2020=100)
  source: "고용노동부, 2024"

# ─── 정책 변수 ───
policy:
  base_rate_pct: 2.75              # 기준금리 (%)
  government_spending_trillion_krw: 656.9  # 정부 재정지출 (조원, 2025)
  energy_subsidy_trillion_krw: 8.5  # 에너지 보조금 (조원)
  food_subsidy_trillion_krw: 2.3    # 식품 보조금 (조원)
  strategic_oil_reserve_days: 96    # 전략비축유 (일수)
  strategic_oil_reserve_mb: 96.5    # 전략비축유 (백만 배럴)
  avg_tariff_rate_pct: 13.4        # 평균 관세율 (농산물)
  source: "기획재정부, 2025"

# ─── 거시경제 기초 (최근 수치) ───
macro_baseline:
  cpi_yoy_pct: 2.1                 # 소비자물가 상승률
  ppi_yoy_pct: 1.8                 # 생산자물가 상승률
  import_price_index_yoy_pct: 3.5  # 수입물가 상승률
  exchange_rate_usd_krw: 1450      # 환율
  trade_balance_billion_usd: 4.2   # 무역수지 (월간, 십억달러)
  unemployment_pct: 2.8            # 실업률
  gdp_growth_yoy_pct: 1.8         # GDP 성장률
  credit_spread_bp: 85             # 기업 신용 스프레드 (bp)
  source: "한국은행/통계청, 2025Q4-2026Q1"
