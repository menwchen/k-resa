# K-RESA 시나리오 정의 파일
# 사전 정의된 복합 시나리오

scenarios:
  # ─── 시나리오 1: 호르무즈 해협 부분 봉쇄 ───
  hormuz_partial:
    name: "호르무즈 해협 부분 봉쇄"
    description: "이란-미국 긴장 고조로 호르무즈 해협 통과 물량 30% 감소"
    crisis_types: ["energy_crisis"]
    severity: "moderate"
    custom_shocks:
      oil_price_change_pct: 60
      lng_price_change_pct: 45
      electricity_cost_change_pct: 25
      exchange_rate_change_pct: 10
    prior_probability: 0.08
    trigger_events:
      - "이란 핵 협상 결렬"
      - "호르무즈 해협 인근 군사 충돌"
      - "이란 원유 수출 제재 강화"

  # ─── 시나리오 2: 호르무즈 해협 완전 봉쇄 ───
  hormuz_full:
    name: "호르무즈 해협 완전 봉쇄"
    description: "무력 충돌로 호르무즈 해협 통과 완전 차단 (1-3개월)"
    crisis_types: ["energy_crisis"]
    severity: "severe"
    custom_shocks:
      oil_price_change_pct: 120
      lng_price_change_pct: 100
      electricity_cost_change_pct: 50
      exchange_rate_change_pct: 20
    prior_probability: 0.02
    trigger_events:
      - "호르무즈 해협 무력 충돌 발생"
      - "유조선 피격 사건"

  # ─── 시나리오 3: 글로벌 곡물 위기 ───
  grain_crisis:
    name: "글로벌 곡물 위기"
    description: "기후변화 + 수출 제한으로 글로벌 곡물 공급 20% 감소"
    crisis_types: ["agri_crisis"]
    severity: "moderate"
    custom_shocks:
      grain_price_change_pct: 50
      fertilizer_price_change_pct: 35
      feed_price_change_pct: 40
    prior_probability: 0.06
    trigger_events:
      - "주요 곡물 생산국 가뭄/홍수"
      - "러시아/우크라이나 곡물 수출 제한"
      - "비료 원료 수출 금지"

  # ─── 시나리오 4: 글로벌 금융 불안 ───
  financial_turmoil:
    name: "글로벌 금융 불안"
    description: "신흥국 외채 위기 확산 + 글로벌 위험회피 심화"
    crisis_types: ["financial_stress"]
    severity: "moderate"
    custom_shocks:
      credit_spread_change_bp: 200
      exchange_rate_change_pct: 15
      interest_rate_change_pct: 0.75
    prior_probability: 0.07
    trigger_events:
      - "신흥국 디폴트 발생"
      - "미 연준 예상 외 긴축"
      - "중국 부동산 시장 급락"

  # ─── 시나리오 5: 복합 위기 (에너지 + 농산물) ───
  energy_agri_compound:
    name: "에너지-농산물 복합 위기"
    description: "에너지 가격 급등이 비료/운송비 상승을 촉발하여 농산물 위기로 확산"
    crisis_types: ["energy_crisis", "agri_crisis"]
    severity: "moderate"
    custom_shocks:
      oil_price_change_pct: 50
      lng_price_change_pct: 40
      electricity_cost_change_pct: 20
      grain_price_change_pct: 35
      fertilizer_price_change_pct: 45
      feed_price_change_pct: 30
      exchange_rate_change_pct: 8
    prior_probability: 0.04
    interaction_factor: 1.15

  # ─── 시나리오 6: 3중 복합 위기 (최악) ───
  triple_crisis:
    name: "3중 복합 위기"
    description: "에너지 + 농산물 + 금융 동시 위기 (2008년 유사)"
    crisis_types: ["energy_crisis", "agri_crisis", "financial_stress"]
    severity: "severe"
    custom_shocks:
      oil_price_change_pct: 80
      lng_price_change_pct: 65
      electricity_cost_change_pct: 35
      grain_price_change_pct: 60
      fertilizer_price_change_pct: 50
      feed_price_change_pct: 55
      credit_spread_change_bp: 300
      exchange_rate_change_pct: 22
      interest_rate_change_pct: 1.0
    prior_probability: 0.01
    interaction_factor: 1.45

# ─── 증거 라이브러리 ───
evidence_library:
  geopolitical:
    - name: "호르무즈 해협 긴장 고조"
      likelihood_ratio: 1.8
      affects: ["energy_crisis"]
    - name: "우크라이나-러시아 분쟁 확대"
      likelihood_ratio: 1.5
      affects: ["energy_crisis", "agri_crisis"]
    - name: "중동 전면전 위험"
      likelihood_ratio: 2.5
      affects: ["energy_crisis", "financial_stress"]

  climate:
    - name: "엘니뇨 발생"
      likelihood_ratio: 1.5
      affects: ["agri_crisis"]
    - name: "주요 곡물지대 가뭄"
      likelihood_ratio: 1.7
      affects: ["agri_crisis"]

  economic:
    - name: "미 연준 긴축 지속"
      likelihood_ratio: 1.3
      affects: ["financial_stress"]
    - name: "중국 경기 급랭"
      likelihood_ratio: 1.4
      affects: ["financial_stress"]
    - name: "OPEC 감산 발표"
      likelihood_ratio: 1.4
      affects: ["energy_crisis"]

  stabilizing:
    - name: "글로벌 경기 회복"
      likelihood_ratio: 0.6
      affects: ["financial_stress"]
    - name: "원유 증산 합의"
      likelihood_ratio: 0.5
      affects: ["energy_crisis"]
    - name: "곡물 풍작 전망"
      likelihood_ratio: 0.4
      affects: ["agri_crisis"]
